<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Learn GPU programming by watching parallel workers paint an image.">
    <title>Paint Pixels in Parallel · GPU Safari</title>
    <link rel="stylesheet" href="../../styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../../" aria-label="GPU Safari home"><span class="brand-mark" aria-hidden="true">GS</span><span>GPU Safari</span></a>
      <div class="trail-name"><span class="trail-label">Trail 01</span><span>First parallel steps</span></div>
    </header>
    <main id="lesson" class="lesson-shell">
      <aside class="lesson-rail" aria-label="Lesson progress">
        <div class="rail-heading"><span class="rail-kicker">Lesson 1</span><strong>Paint Pixels in Parallel</strong></div>
        <ol id="progress-list" class="progress-list"></ol>
        <div class="rail-note"><span class="status-dot" aria-hidden="true"></span>No GPU required</div>
      </aside>
      <section class="lesson-stage" aria-labelledby="step-title">
        <div class="stage-topline"><span id="step-count">Step 1 of 7</span><span id="execution-mode" class="simulation-label">Concept simulation</span></div>
        <div id="step-content" class="step-content" aria-live="polite"></div>
        <section id="processing-panel" class="processing-panel" hidden aria-labelledby="processing-heading">
          <h2 id="processing-heading" class="sr-only">CPU and GPU processing view</h2>
          <div id="processing-scene"></div>
          <p id="processing-status" class="sr-only" aria-live="polite">Ready to play the processing view.</p>
        </section>
        <footer class="lesson-controls"><button id="back-button" class="button button-quiet" type="button">← Back</button><button id="next-button" class="button button-primary" type="button">Continue →</button></footer>
      </section>
    </main>
    <noscript>This guided lab requires JavaScript for its interactive simulation.</noscript>
    <script type="module" src="../../src/app.mjs"></script>
  </body>
</html>
